<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Sorpresa Especial - Para la Doctora más Hermosa ❤️</title>
    <!-- Fuentes elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030305;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* Contenedor formato celular (390 x 850 px) */
        .card-container {
            width: 390px;
            height: 850px;
            background: radial-gradient(circle at 50% 40%, #221808 0%, #0c0803 50%, #020204 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 35px rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 35px 20px 30px 20px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        /* Canvas para partículas doradas y estrellas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Texto Superior */
        .top-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #f3e5ab;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            z-index: 3;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards 0.3s;
        }

        /* Escena Principal */
        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 640px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .scene-svg {
            width: 380px;
            height: 630px;
            overflow: visible;
        }

        /* --- ANIMACIONES DE LA CAJA --- */
        
        /* Descenso/Aparición de la Caja */
        .gift-box-group {
            opacity: 0;
            transform: translateY(50px);
            animation: dropBox 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.8s;
            transform-origin: center bottom;
        }

        /* Levantamiento y apertura de la tapa de la caja */
        .box-lid {
            transform-origin: 195px 400px;
            animation: openLid 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards 2.5s;
        }

        /* Sombra de la tapa al abrirse */
        .lid-glow {
            opacity: 0;
            animation: lidFlash 1.5s ease-out forwards 2.7s;
        }

        /* Desvanecimiento del cuerpo de la caja para centrar la atención en el ramo */
        .box-body-fade {
            animation: fadeBoxBody 1.5s ease-in-out forwards 4.0s;
        }

        /* --- ANIMACIONES DEL RAMO Y TULIPANES --- */

        /* Salida del Ramo desde la Caja */
        .bouquet-rise {
            opacity: 0;
            transform: translateY(160px) scale(0.65);
            animation: riseBouquet 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards 3.2s;
            transform-origin: 195px 500px;
        }

        /* Balanceo suave estilo brisa */
        .sway-gentle {
            animation: sway 5s ease-in-out infinite alternate 5.5s;
            transform-origin: 195px 520px;
        }

        /* Crecimiento de Tulipanes */
        .tulip-bloom {
            transform-origin: center bottom;
            opacity: 0;
            transform: scale(0.2);
            animation: bloomTulip 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Brillo destello en tulipanes */
        .sparkle-pop {
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        /* --- TEXTO INFERIOR --- */
        .romantic-text-container {
            text-align: center;
            z-index: 3;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .romantic-text {
            font-family: 'Great Vibes', cursive;
            font-size: 33px;
            color: #fff3cc;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 0 0 22px rgba(255, 180, 0, 0.4);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 1.8s ease-out forwards 4.8s;
            line-height: 1.1;
        }

        /* KEYFRAMES */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dropBox {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes openLid {
            0% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-35px) rotate(-5deg); }
            100% { transform: translateY(-190px) rotate(-18deg) scale(0.85); opacity: 0; }
        }

        @keyframes lidFlash {
            0% { opacity: 0; }
            50% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        @keyframes fadeBoxBody {
            0% { opacity: 1; }
            100% { opacity: 0.25; transform: translateY(40px) scale(0.9); }
        }

        @keyframes riseBouquet {
            0% { opacity: 0; transform: translateY(160px) scale(0.65); }
            60% { opacity: 1; transform: translateY(-30px) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes bloomTulip {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes sway {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Canvas de Partículas Doradas y Estrellas -->
        <canvas id="particles-canvas"></canvas>

        <!-- Texto Superior -->
        <div class="top-subtitle">UNA SORPRESA ESPECIAL</div>

        <!-- Contenedor de la Escena SVG -->
        <div class="scene-wrapper">
            <svg class="scene-svg" viewBox="0 0 390 630" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- FILTROS DE ILUMINACIÓN Y BRILLO -->
                    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    
                    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <filter id="shadow-3d" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
                    </filter>

                    <!-- DEGRADADOS DE PÉTALOS TULIPÁN REAL -->
                    <linearGradient id="tulip-petal-main" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#d47a00" />
                        <stop offset="30%" stop-color="#ffb700" />
                        <stop offset="75%" stop-color="#ffe600" />
                        <stop offset="100%" stop-color="#ffffaa" />
                    </linearGradient>

                    <linearGradient id="tulip-petal-side" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#b86200" />
                        <stop offset="40%" stop-color="#ffa000" />
                        <stop offset="85%" stop-color="#ffea55" />
                        <stop offset="100%" stop-color="#ffffcc" />
                    </linearGradient>

                    <linearGradient id="tulip-petal-inner" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#8a4300" />
                        <stop offset="50%" stop-color="#e68a00" />
                        <stop offset="100%" stop-color="#ffd233" />
                    </linearGradient>

                    <!-- DEGRADADOS DE TALLOS Y HOJAS -->
                    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#224817" />
                        <stop offset="50%" stop-color="#4d8b38" />
                        <stop offset="100%" stop-color="#193810" />
                    </linearGradient>

                    <linearGradient id="leaf-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#5c9c38" />
                        <stop offset="50%" stop-color="#3b6e22" />
                        <stop offset="100%" stop-color="#1c380f" />
                    </linearGradient>

                    <linearGradient id="leaf-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#72b547" />
                        <stop offset="70%" stop-color="#2d5918" />
                        <stop offset="100%" stop-color="#142b0a" />
                    </linearGradient>

                    <!-- DEGRADADOS ENVOLTORIO RAMO (Papel Crema/Dorado) -->
                    <linearGradient id="paper-outer" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fefcf0" />
                        <stop offset="40%" stop-color="#ede0ca" />
                        <stop offset="85%" stop-color="#cbb596" />
                        <stop offset="100%" stop-color="#a38c6d" />
                    </linearGradient>

                    <linearGradient id="paper-inner" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#d1be9d" />
                        <stop offset="100%" stop-color="#a18b6e" />
                    </linearGradient>

                    <!-- DEGRADADOS CAJA DE REGALO -->
                    <linearGradient id="box-gold" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbe8a6" />
                        <stop offset="30%" stop-color="#d4af37" />
                        <stop offset="70%" stop-color="#aa820a" />
                        <stop offset="100%" stop-color="#614800" />
                    </linearGradient>

                    <linearGradient id="ribbon-red" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#e62e00" />
                        <stop offset="50%" stop-color="#ff6666" />
                        <stop offset="100%" stop-color="#990000" />
                    </linearGradient>

                    <linearGradient id="tag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#f0e3ce" />
                    </linearGradient>
                </defs>

                <!-- ==================== CAJA DE REGALO ==================== -->
                <g class="gift-box-group">
                    <!-- Sombra Base de la Caja -->
                    <ellipse cx="195" cy="530" rx="110" ry="22" fill="#000000" opacity="0.65" />

                    <!-- CUERPO DE LA CAJA -->
                    <g class="box-body-fade" filter="url(#shadow-3d)">
                        <!-- Cara Frontal Base -->
                        <path d="M 105 410 L 285 410 L 275 515 C 275 523 265 530 255 530 L 135 530 C 125 530 115 523 115 515 Z" fill="url(#box-gold)" />
                        <!-- Detalle Pliegue 3D Frontal -->
                        <path d="M 105 410 L 195 425 L 285 410 L 275 515 L 195 530 L 115 515 Z" fill="rgba(255,255,255,0.08)" />
                        <!-- Cinta Vertical Caja -->
                        <rect x="180" y="413" width="30" height="115" fill="url(#ribbon-red)" />
                        <rect x="182" y="413" width="6" height="115" fill="#ffa3a3" opacity="0.5" />
                    </g>

                    <!-- TAPA DE LA CAJA (ANIMADA) -->
                    <g class="box-lid" filter="url(#shadow-3d)">
                        <!-- Destello al abrir -->
                        <ellipse class="lid-glow" cx="195" cy="395" rx="100" ry="30" fill="#ffe680" filter="url(#gold-glow)" />
                        <!-- Borde / Tapa Principal -->
                        <path d="M 95 385 C 95 378 105 370 120 370 L 270 370 C 285 370 295 378 295 385 L 290 412 C 290 417 280 422 265 422 L 125 422 C 110 422 100 417 100 412 Z" fill="url(#box-gold)" />
                        <!-- Cinta Tapa Horizontal y Vertical -->
                        <rect x="178" y="370" width="34" height="51" fill="url(#ribbon-red)" />
                        <!-- Lazo Superior Tapa -->
                        <path d="M 195 370 C 160 330 120 365 180 372 Z" fill="url(#ribbon-red)" />
                        <path d="M 195 370 C 230 330 270 365 210 372 Z" fill="url(#ribbon-red)" />
                        <circle cx="195" cy="370" r="8" fill="#ff8080" />
                    </g>
                </g>

                <!-- ==================== RAMO DE TULIPANES ==================== -->
                <g class="bouquet-rise">
                    <g class="sway-gentle">

                        <!-- FONDOS Y PAPEL TRASERO DEL ENVOLTORIO -->
                        <g filter="url(#shadow-3d)">
                            <!-- Papel Trasero Desplegado -->
                            <path d="M 100 240 L 195 150 L 290 240 L 235 470 L 155 470 Z" fill="url(#paper-inner)" />
                        </g>

                        <!-- TALLOS REALISTAS DE TULIPÁN -->
                        <g id="stems">
                            <!-- Tallo 1 (Centro Alto) -->
                            <path d="M 195 440 Q 192 310 195 180" stroke="url(#stem-grad)" stroke-width="8" stroke-linecap="round" fill="none" />
                            <!-- Tallo 2 (Izquierda Alto) -->
                            <path d="M 190 440 Q 160 320 145 210" stroke="url(#stem-grad)" stroke-width="7.5" stroke-linecap="round" fill="none" />
                            <!-- Tallo 3 (Derecha Alto) -->
                            <path d="M 200 440 Q 230 320 245 220" stroke="url(#stem-grad)" stroke-width="7.5" stroke-linecap="round" fill="none" />
                            <!-- Tallo 4 (Izquierda Medio) -->
                            <path d="M 185 440 Q 135 340 115 255" stroke="url(#stem-grad)" stroke-width="7" stroke-linecap="round" fill="none" />
                            <!-- Tallo 5 (Derecha Medio) -->
                            <path d="M 205 440 Q 255 350 270 265" stroke="url(#stem-grad)" stroke-width="7" stroke-linecap="round" fill="none" />
                        </g>

                        <!-- HOJAS LARGAS TÍPICAS DE TULIPÁN -->
                        <g id="leaves">
                            <!-- Hoja Izquierda Extendida -->
                            <path d="M 185 410 Q 110 350 90 260 Q 130 290 175 360 Z" fill="url(#leaf-grad-1)" />
                            <!-- Hoja Derecha Extendida -->
                            <path d="M 205 410 Q 280 350 300 270 Q 260 300 215 360 Z" fill="url(#leaf-grad-2)" />
                            <!-- Hoja Central 1 -->
                            <path d="M 190 380 Q 140 280 165 210 Q 175 260 192 330 Z" fill="url(#leaf-grad-2)" />
                            <!-- Hoja Central 2 -->
                            <path d="M 200 380 Q 250 290 225 220 Q 215 270 198 330 Z" fill="url(#leaf-grad-1)" />
                        </g>

                        <!-- NUBES DE NUBECITAS / FLORES BLANCAS DE RELLENO (BABY'S BREATH) -->
                        <g id="fillers" opacity="0.9">
                            <!-- Ramitos blancos pequeñitos -->
                            <g stroke="#ffffff" stroke-width="1.5" fill="#ffffff">
                                <path d="M 140 270 L 130 255 M 140 270 L 145 250 M 140 270 L 125 265" />
                                <circle cx="130" cy="255" r="3" /> <circle cx="145" cy="250" r="3.5" /> <circle cx="125" cy="265" r="2.5" />
                                
                                <path d="M 250 280 L 265 265 M 250 280 L 255 260 M 250 280 L 270 275" />
                                <circle cx="265" cy="265" r="3" /> <circle cx="255" cy="260" r="3.5" /> <circle cx="270" cy="275" r="2.5" />

                                <path d="M 195 250 L 190 235 M 195 250 L 205 230" />
                                <circle cx="190" cy="235" r="3" /> <circle cx="205" cy="230" r="3" />
                            </g>
                        </g>

                        <!-- ================= 5 TULIPANES REALISTAS ================= -->

                        <!-- TULIPÁN 1: CENTRO ALTO (Principal) -->
                        <g class="tulip-bloom" style="animation-delay: 3.4s; transform-origin: 195px 175px;">
                            <!-- Resplandor Dorado de Flor -->
                            <circle cx="195" cy="170" r="35" fill="#ffaa00" opacity="0.3" filter="url(#gold-glow)" />
                            <g filter="url(#shadow-3d)">
                                <!-- Pétalo Trasero/Interior -->
                                <path d="M 178 165 C 175 125 215 125 212 165 C 210 190 180 190 178 165 Z" fill="url(#tulip-petal-inner)" />
                                <!-- Pétalo Izquierdo -->
                                <path d="M 170 160 C 160 120 200 115 195 165 C 192 195 168 185 170 160 Z" fill="url(#tulip-petal-side)" />
                                <!-- Pétalo Derecho -->
                                <path d="M 220 160 C 230 120 190 115 195 165 C 198 195 222 185 220 160 Z" fill="url(#tulip-petal-side)" />
                                <!-- Pétalo Frontal Principal (Forma Copado Tulipán) -->
                                <path d="M 173 155 C 170 110 220 110 217 155 C 215 198 175 198 173 155 Z" fill="url(#tulip-petal-main)" />
                                <!-- Luz/Brillo Curvo Frontal -->
                                <path d="M 183 145 Q 195 135 207 145 Q 195 185 183 145 Z" fill="#ffffff" opacity="0.35" />
                            </g>
                        </g>

                        <!-- TULIPÁN 2: IZQUIERDA ALTO -->
                        <g class="tulip-bloom" style="animation-delay: 3.6s; transform-origin: 145px 205px;">
                            <circle cx="145" cy="200" r="32" fill="#ffaa00" opacity="0.25" filter="url(#gold-glow)" />
                            <g filter="url(#shadow-3d)">
                                <path d="M 130 195 C 128 160 162 160 160 195 C 158 218 132 218 130 195 Z" fill="url(#tulip-petal-inner)" />
                                <path d="M 123 190 C 115 155 150 150 145 195 C 142 222 121 212 123 190 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 167 190 C 175 155 140 150 145 195 C 148 222 169 212 167 190 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 125 185 C 122 145 168 145 165 185 C 163 224 127 224 125 185 Z" fill="url(#tulip-petal-main)" />
                                <path d="M 134 175 Q 145 167 156 175 Q 145 210 134 175 Z" fill="#ffffff" opacity="0.35" />
                            </g>
                        </g>

                        <!-- TULIPÁN 3: DERECHA ALTO -->
                        <g class="tulip-bloom" style="animation-delay: 3.8s; transform-origin: 245px 215px;">
                            <circle cx="245" cy="210" r="32" fill="#ffaa00" opacity="0.25" filter="url(#gold-glow)" />
                            <g filter="url(#shadow-3d)">
                                <path d="M 230 205 C 228 170 262 170 260 205 C 258 228 232 228 230 205 Z" fill="url(#tulip-petal-inner)" />
                                <path d="M 223 200 C 215 165 250 160 245 205 C 242 232 221 222 223 200 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 267 200 C 275 165 240 160 245 205 C 248 232 269 222 267 200 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 225 195 C 222 155 268 155 265 195 C 263 234 227 234 225 195 Z" fill="url(#tulip-petal-main)" />
                                <path d="M 234 185 Q 245 177 256 185 Q 245 220 234 185 Z" fill="#ffffff" opacity="0.35" />
                            </g>
                        </g>

                        <!-- TULIPÁN 4: IZQUIERDA MEDIO (Ligeramente Inclinado) -->
                        <g class="tulip-bloom" style="animation-delay: 4.0s; transform-origin: 115px 250px;">
                            <circle cx="115" cy="245" r="30" fill="#ffaa00" opacity="0.25" filter="url(#gold-glow)" />
                            <g filter="url(#shadow-3d)" transform="rotate(-12 115 245)">
                                <path d="M 102 238 C 100 205 132 205 130 238 C 128 259 104 259 102 238 Z" fill="url(#tulip-petal-inner)" />
                                <path d="M 95 233 C 88 200 121 197 117 238 C 114 263 94 253 95 233 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 137 233 C 144 200 111 197 115 238 C 118 263 138 253 137 233 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 97 228 C 95 192 137 192 135 228 C 133 264 100 264 97 228 Z" fill="url(#tulip-petal-main)" />
                                <path d="M 105 220 Q 116 212 126 220 Q 116 250 105 220 Z" fill="#ffffff" opacity="0.35" />
                            </g>
                        </g>

                        <!-- TULIPÁN 5: DERECHA MEDIO (Ligeramente Inclinado) -->
                        <g class="tulip-bloom" style="animation-delay: 4.2s; transform-origin: 270px 260px;">
                            <circle cx="270" cy="255" r="30" fill="#ffaa00" opacity="0.25" filter="url(#gold-glow)" />
                            <g filter="url(#shadow-3d)" transform="rotate(12 270 260)">
                                <path d="M 257 253 C 255 220 287 220 285 253 C 283 274 259 274 257 253 Z" fill="url(#tulip-petal-inner)" />
                                <path d="M 250 248 C 243 215 276 212 272 253 C 269 278 249 268 250 248 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 292 248 C 299 215 266 212 270 253 C 273 278 293 268 292 248 Z" fill="url(#tulip-petal-side)" />
                                <path d="M 252 243 C 250 207 292 207 290 243 C 288 279 255 279 252 243 Z" fill="url(#tulip-petal-main)" />
                                <path d="M 260 235 Q 271 227 281 235 Q 271 265 260 235 Z" fill="#ffffff" opacity="0.35" />
                            </g>
                        </g>


                        <!-- ENVOLTORIO FRONTAL COMPLETO CON LAZO Y TARJETA -->
                        <g filter="url(#shadow-3d)">
                            <!-- Doblez Izquierdo Papel -->
                            <path d="M 95 240 L 195 380 L 145 475 L 85 270 Z" fill="#e3d2b8" opacity="0.8" />
                            
                            <!-- Doblez Derecho Papel -->
                            <path d="M 295 240 L 195 380 L 245 475 L 305 270 Z" fill="#c4af93" opacity="0.9" />

                            <!-- Cono Central Envoltorio Principal -->
                            <path d="M 90 240 Q 195 285 300 240 L 235 475 Q 195 485 155 475 Z" fill="url(#paper-outer)" />
                            
                            <!-- Sombras de pliegue 3D del cono -->
                            <path d="M 90 240 Q 150 300 165 475" stroke="#b59f84" stroke-width="2" fill="none" opacity="0.5" />
                            <path d="M 300 240 Q 240 300 225 475" stroke="#b59f84" stroke-width="2" fill="none" opacity="0.5" />

                            <!-- TARJETA COLGANTE ELEGANTE -->
                            <g transform="rotate(-8 160 420)">
                                <!-- Hilo de la Tarjeta -->
                                <line x1="160" y1="400" x2="150" y2="425" stroke="#8c6d46" stroke-width="1.5" />
                                <!-- Tarjeta -->
                                <rect x="125" y="425" width="50" height="32" rx="4" fill="url(#tag-grad)" stroke="#d4af37" stroke-width="1" />
                                <!-- Corazoncito y Línea en la tarjeta -->
                                <path d="M 150 435 C 148 430 140 432 144 438 L 150 443 L 156 438 C 160 432 152 430 150 435 Z" fill="#d93838" />
                                <line x1="135" y1="448" x2="165" y2="448" stroke="#a89274" stroke-width="1" stroke-dasharray="2,2" />
                            </g>

                            <!-- LAZO/MOÑO DORADO EN LA BASE DEL RAMO -->
                            <g>
                                <!-- Cintas colgantes -->
                                <path d="M 185 470 Q 160 520 130 550 Q 150 555 175 530 L 192 475 Z" fill="url(#box-gold)" />
                                <path d="M 205 470 Q 230 520 260 550 Q 240 555 215 530 L 198 475 Z" fill="url(#box-gold)" />

                                <!-- Moño Izquierdo -->
                                <path d="M 195 470 C 130 430 110 490 190 480 Z" fill="url(#box-gold)" />
                                <!-- Moño Derecho -->
                                <path d="M 195 470 C 260 430 280 490 200 480 Z" fill="url(#box-gold)" />

                                <!-- Nudo Central Lazo -->
                                <rect x="187" y="463" width="16" height="15" rx="4" fill="#614800" />
                                <rect x="189" y="464" width="12" height="13" rx="3" fill="url(#box-gold)" />
                            </g>
                        </g>

                        <!-- DESTELLOS MÁGICOS DE LUZ Y BRILLO EN EL RAMO -->
                        <g class="sparkle-pop" style="animation-delay: 0.2s;">
                            <path d="M 200 130 L 202 136 L 208 138 L 202 140 L 200 146 L 198 140 L 192 138 L 198 136 Z" fill="#ffffff" filter="url(#soft-glow)" />

    <!-- JavaScript para la animación de estrellas y partículas flotantes -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;

            function resize() {
                width = canvas.width = canvas.parentElement.clientWidth;
                height = canvas.height = canvas.parentElement.clientHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            const numStars = 55;
            const numParticles = 40;
            const elements = [];

            // Clase Estrellas Parpadeantes
            class Star {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.4 + 0.4;
                    this.alpha = Math.random();
                    this.speed = Math.random() * 0.015 + 0.005;
                    this.growing = Math.random() > 0.5;
                }

                update() {
                    if (this.growing) {
                        this.alpha += this.speed;
                        if (this.alpha >= 0.95) this.growing = false;
                    } else {
                        this.alpha -= this.speed;
                        if (this.alpha <= 0.15) this.growing = true;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Clase Partículas Doradas Flotantes
            class GoldParticle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 20;
                    this.size = Math.random() * 2.2 + 0.8;
                    this.speedY = Math.random() * 0.7 + 0.25;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.alpha = Math.random() * 0.7 + 0.3;
                    this.decay = Math.random() * 0.002 + 0.001;
                }

                update() {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.y * 0.015) * 0.35 + this.speedX;
                    this.alpha -= this.decay;

                    if (this.y < -10 || this.alpha <= 0) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.fillStyle = "#ffd700";
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = "#ffb700";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Crear elementos
            for (let i = 0; i < numStars; i++) {
                elements.push(new Star());
            }

            for (let i = 0; i < numParticles; i++) {
                elements.push(new GoldParticle());
            }

            // Loop de renderizado
            function animate() {
                ctx.clearRect(0, 0, width, height);

                elements.forEach(el => {
                    el.update();
                    el.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
