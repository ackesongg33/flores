<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Caja de Tulipanes Mágica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; 
      padding: 0; 
      background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 100vh; 
      overflow: hidden; 
      font-family: 'Montserrat', sans-serif;
    }
    .container {
      position: relative; 
      width: 400px; 
      height: 800px; 
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* Textos */
    .title-top {
      position: absolute;
      top: 50px;
      width: 100%;
      text-align: center;
      color: #d4af37;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      z-index: 10;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    .footer-text {
      position: absolute;
      bottom: 50px;
      width: 100%;
      text-align: center;
      font-family: 'Great Vibes', cursive;
      color: #fff3d1;
      font-size: 36px;
      z-index: 10;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5), 0 0 30px rgba(255, 180, 0, 0.3);
    }
    .heart {
      color: #ff3366;
      display: inline-block;
      animation: pulse-heart 1.5s infinite;
    }
    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* Magic particles */
    .particle {
      position: absolute; 
      width: 5px; 
      height: 5px; 
      background: #ffd700; 
      border-radius: 50%;
      opacity: 0; 
      pointer-events: none;
      box-shadow: 0 0 10px #ffd700;
      z-index: 1;
    }
    .open .particle {
      animation: sparkle 2s ease-out infinite;
    }
    @keyframes sparkle {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-150px) scale(0); opacity: 0; }
    }

    /* Animations and States */
    #lid {
      transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s;
      transform-origin: center;
    }
    #bouquet {
      transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.27), opacity 1.2s;
      transform-origin: center bottom;
      transform: translateY(180px) scale(0.2);
      opacity: 0;
    }
    .open #lid {
      transform: translateY(-220px) rotate(-15deg);
      opacity: 0;
    }
    .open #bouquet {
      transform: translateY(-30px) scale(1);
      opacity: 1;
    }

    /* Ribbon */
    #tied-ribbon { transition: opacity 0.4s; opacity: 1; }
    #untied-ribbon { transition: opacity 1s 0.2s; opacity: 0; stroke-dasharray: 200; stroke-dashoffset: 200; }
    .open #tied-ribbon { opacity: 0; }
    .open #untied-ribbon { 
      opacity: 1; 
      animation: draw-ribbon 1s forwards ease-out;
    }
    @keyframes draw-ribbon {
      to { stroke-dashoffset: 0; }
    }

    .hint {
      position: absolute; 
      bottom: 120px; 
      width: 100%; 
      text-align: center;
      color: #f1c40f; 
      font-size: 12px; 
      letter-spacing: 2px;
      text-transform: uppercase; 
      pointer-events: none;
      transition: opacity 0.5s;
      animation: pulse 1.5s infinite;
      z-index: 10;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .open ~ .hint { opacity: 0; display: none; }
