<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la Doctora más Hermosa ❤️</title>
    <!-- Fuente elegante de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* Contenedor principal con formato vertical tipo celular (390x850 px) */
        .card-container {
            width: 390px;
            height: 850px;
            background: radial-gradient(circle at 50% 45%, #2a1f0d 0%, #0d0a05 45%, #030305 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px 40px 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* Canvas para estrellas y partículas doradas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Título superior sutil */
        .top-subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.7);
            margin-top: 15px;
            z-index: 2;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards 0.5s;
        }

        /* Área de la escena SVG del Ramo */
        .bouquet-wrapper {
            position: relative;
            width: 100%;
            height: 580px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
        }

        .bouquet-svg {
            width: 360px;
            height: 560px;
            overflow: visible;
        }

        /* Animaciones CSS del SVG */
        .grow-stem {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: growStem 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .flower-bud {
            transform-origin: center;
            transform: scale(0);
            opacity: 0;
            animation: popFlower 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .wrapper-paper {
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            animation: showWrapper 1.8s ease-out forwards 1.2s;
            transform-origin: bottom center;
        }

        .ribbon-bow {
            opacity: 0;
            transform: scale(0.5);
            animation: popRibbon 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.2s;
            transform-origin: center;
        }

        .sway-gentle {
            animation: sway 4s ease-in-out infinite alternate;
            transform-origin: 200px 500px;
        }

        .leaf-pop {
            transform-origin: center;
            opacity: 0;
            transform: scale(0);
            animation: popLeaf 1.2s ease-out forwards;
        }

        .sparkle-star {
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        /* Texto Romántico */
        .romantic-text-container {
            text-align: center;
            z-index: 2;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .romantic-text {
            font-family: 'Great Vibes', cursive;
            font-size: 34px;
            color: #ffe699;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 180, 0, 0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 2s ease-out forwards 3.2s;
            line-height: 1.2;
        }

        /* Keyframes */
        @keyframes growStem {
            to { stroke-dashoffset: 0; }
        }

        @keyframes popFlower {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes showWrapper {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes popRibbon {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes popLeaf {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes sway {
            0% { transform: rotate(-1.5deg); }
            100% { transform: rotate(1.5deg); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Fondo interactivo con partículas -->
        <canvas id="particles-canvas"></canvas>

        <div class="top-subtitle">Una Sorpresa Especial</div>

        <!-- Ramo de Flores SVG -->
        <div class="bouquet-wrapper">
            <svg class="bouquet-svg sway-gentle" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Defs para degradados y filtros de iluminación -->
                    <!-- Brillo de las flores -->
                    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="10" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    
                    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <!-- Degradados de Flores Tulipa / Girasol estilizado -->
                    <linearGradient id="yellow-petal" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#e69500" />
                        <stop offset="45%" stop-color="#ffcc00" />
                        <stop offset="90%" stop-color="#ffee77" />
                        <stop offset="100%" stop-color="#ffffff" />
                    </linearGradient>

                    <linearGradient id="yellow-petal-bright" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#ffaa00" />
                        <stop offset="60%" stop-color="#ffdd33" />
                        <stop offset="100%" stop-color="#ffffbb" />
                    </linearGradient>

                    <!-- Degradados de Tallos -->
                    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2d5a27" />
                        <stop offset="50%" stop-color="#4e8b39" />
                        <stop offset="100%" stop-color="#1e3e18" />
                    </linearGradient>

                    <!-- Degradados de Hojas -->
                    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#5a9e32" />
                        <stop offset="100%" stop-color="#224817" />
                    </linearGradient>

                    <!-- Degradado Envoltorio Papel Crema Premium -->
                    <linearGradient id="paper-front" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fdfbf7" />
                        <stop offset="50%" stop-color="#ebdccb" />
                        <stop offset="100%" stop-color="#cbb59d" />
                    </linearGradient>

                    <linearGradient id="paper-back" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#d4c0a8" />
                        <stop offset="100%" stop-color="#a89279" />
                    </linearGradient>

                    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ecc6b0" />
                        <stop offset="50%" stop-color="#c99c82" />
                        <stop offset="100%" stop-color="#9e6f56" />
                    </linearGradient>

                    <!-- Sombra Paralela -->
                    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
                        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
                    </filter>
                </defs>

                <!-- TALLOS EN CRECIMIENTO -->
                <g id="stems">
                    <!-- Tallo Flor Trasera Izquierda -->
                    <path class="grow-stem" d="M 195 480 Q 150 320 130 180" stroke="url(#stem-grad)" stroke-width="7" fill="none" stroke-linecap="round" style="animation-delay: 0.1s;" />
                    
                    <!-- Tallo Flor Trasera Derecha -->
                    <path class="grow-stem" d="M 205 480 Q 240 310 230 150" stroke="url(#stem-grad)" stroke-width="7" fill="none" stroke-linecap="round" style="animation-delay: 0.2s;" />

                    <!-- Tallo Flor Centro Alta -->
                    <path class="grow-stem" d="M 200 480 Q 195 330 185 210" stroke="url(#stem-grad)" stroke-width="8" fill="none" stroke-linecap="round" style="animation-delay: 0.3s;" />

                    <!-- Tallo Flor Frontal Izquierda -->
                    <path class="grow-stem" d="M 190 480 Q 130 360 115 280" stroke="url(#stem-grad)" stroke-width="7.5" fill="none" stroke-linecap="round" style="animation-delay: 0.4s;" />

                    <!-- Tallo Flor Frontal Derecha -->
                    <path class="grow-stem" d="M 210 480 Q 255 350 245 280" stroke="url(#stem-grad)" stroke-width="7.5" fill="none" stroke-linecap="round" style="animation-delay: 0.5s;" />
                </g>

                <!-- HOJAS -->
                <g id="leaves">
                    <!-- Hojas variadas por el ramo -->
                    <path class="leaf-pop" d="M 155 330 C 110 320 90 280 110 260 C 130 260 155 290 155 330 Z" fill="url(#leaf-grad)" style="animation-delay: 1.0s;" />
                    <path class="leaf-pop" d="M 230 320 C 275 300 295 260 270 245 C 250 250 230 280 230 320 Z" fill="url(#leaf-grad)" style="animation-delay: 1.1s;" />
                    <path class="leaf-pop" d="M 185 360 C 140 370 120 400 135 420 C 155 410 180 390 185 360 Z" fill="url(#leaf-grad)" style="animation-delay: 1.2s;" />
                    <path class="leaf-pop" d="M 210 350 C 260 360 285 390 270 410 C 245 400 215 380 210 350 Z" fill="url(#leaf-grad)" style="animation-delay: 1.3s;" />
                    <path class="leaf-pop" d="M 175 250 C 145 220 150 180 165 180 C 175 190 180 220 175 250 Z" fill="url(#leaf-grad)" style="animation-delay: 1.4s;" />
                    <path class="leaf-pop" d="M 215 240 C 245 210 235 170 220 175 C 215 185 210 210 215 240 Z" fill="url(#leaf-grad)" style="animation-delay: 1.5s;" />
                </g>

                <!-- PAPEL TRASERO DEL ENVOLTORIO -->
                <g class="wrapper-paper" filter="url(#drop-shadow)">
                    <polygon points="110,240 290,240 235,490 165,490" fill="url(#paper-back)" />
                </g>

                <!-- FLORES (4 PRINCIPALES + SECUNDARIAS PARA LUZ Y VOLUMEN SEGÚN REFERENCIA) -->
                <!-- Flor 1: Fondo Izquierda Alta -->
                <g class="flower-bud" style="animation-delay: 1.6s; transform-origin: 130px 180px;" filter="url(#glow-gold)">
                    <!-- Resplandor de fondo -->
                    <circle cx="130" cy="180" r="35" fill="#ffaa00" opacity="0.25" />
                    <!-- Capa externa pétalos -->
                    <path d="M 110 180 C 100 140 125 130 130 130 C 135 130 160 140 150 180 C 140 200 120 200 110 180 Z" fill="url(#yellow-petal)" />
                    <!-- Capa central tulipa -->
                    <path d="M 115 175 C 110 145 128 135 130 135 C 132 135 150 145 145 175 C 140 190 120 190 115 175 Z" fill="url(#yellow-petal-bright)" />
                    <path d="M 122 170 C 120 150 130 142 130 142 C 130 142 140 150 138 170 Z" fill="#fff5aa" opacity="0.8" />
                </g>

                <!-- Flor 2: Fondo Derecha Alta -->
                <g class="flower-bud" style="animation-delay: 1.8s; transform-origin: 230px 150px;" filter="url(#glow-gold)">
                    <circle cx="230" cy="150" r="38" fill="#ffaa00" opacity="0.25" />
                    <path d="M 208 150 C 198 105 224 95 230 95 C 236 95 262 105 252 150 C 242 172 218 172 208 150 Z" fill="url(#yellow-petal)" />
                    <path d="M 214 145 C 208 112 228 102 230 102 C 232 102 252 112 246 145 C 240 162 220 162 214 145 Z" fill="url(#yellow-petal-bright)" />
                    <path d="M 221 140 C 218 120 230 110 230 110 C 230 110 242 120 239 140 Z" fill="#fff5aa" opacity="0.8" />
                </g>

                <!-- Flor 3: Centro Media -->
                <g class="flower-bud" style="animation-delay: 2.0s; transform-origin: 185px 210px;" filter="url(#glow-gold)">
                    <circle cx="185" cy="210" r="40" fill="#ffaa00" opacity="0.3" />
                    <path d="M 160 210 C 148 160 178 150 185 150 C 192 150 222 160 210 210 C 198 235 172 235 160 210 Z" fill="url(#yellow-petal)" />
                    <path d="M 167 205 C 160 168 183 158 185 158 C 187 158 210 168 203 205 C 196 225 174 225 167 205 Z" fill="url(#yellow-petal-bright)" />
                    <path d="M 175 200 C 172 175 185 165 185 165 C 185 165 198 175 195 200 Z" fill="#ffffff" opacity="0.85" />
                </g>

                <!-- Flor 4: Frontal Derecha -->
                <g class="flower-bud" style="animation-delay: 2.2s; transform-origin: 245px 280px;" filter="url(#glow-gold)">
                    <circle cx="245" cy="280" r="42" fill="#ffaa00" opacity="0.3" />
                    <path d="M 218 280 C 205 225 238 215 245 215 C 252 215 285 225 272 280 C 258 308 232 308 218 280 Z" fill="url(#yellow-petal)" />
                    <path d="M 226 274 C 218 234 243 223 245 223 C 247 223 272 234 264 274 C 256 295 234 295 226 274 Z" fill="url(#yellow-petal-bright)" />
                    <path d="M 235 268 C 231 242 245 230 245 230 C 245 230 259 242 255 268 Z" fill="#ffffff" opacity="0.9" />
                </g>

                <!-- Flor 5 (Frontal Izquierda complementaria estilo bouquet de imagen) -->
                <g class="flower-bud" style="animation-delay: 2.4s; transform-origin: 115px 280px;" filter="url(#glow-gold)">
                    <circle cx="115" cy="280" r="38" fill="#ffaa00" opacity="0.3" />
                    <path d="M 90 280 C 78 230 108 220 115 220 C 122 220 152 230 140 280 C 128 305 102 305 90 280 Z" fill="url(#yellow-petal)" />
                    <path d="M 97 274 C 90 237 113 228 115 228 C 117 228 140 237 133 274 C 125 292 105 292 97 274 Z" fill="url(#yellow-petal-bright)" />
                    <path d="M 106 268 C 102 245 115 235 115 235 C 115 235 128 245 124 268 Z" fill="#ffffff" opacity="0.85" />
                </g>

                <!-- PAPEL FRONTAL DEL ENVOLTORIO CON ESTILO Y SOMBRAS 3D -->
                <g class="wrapper-paper" filter="url(#drop-shadow)">
                    <!-- Doblez Trasero Izquierdo -->
                    <path d="M 100 250 L 200 370 L 140 470 L 80 290 Z" fill="#dfcca4" opacity="0.7" />
                    
                    <!-- Capa Principal Izquierda -->
                    <path d="M 85 260 L 200 480 L 110 320 Z" fill="url(#paper-front)" />
                    
                    <!-- Capa Principal Derecha Envolvente -->
                    <path d="M 315 260 L 200 480 L 290 320 Z" fill="url(#paper-back)" />

                    <!-- Cono Central Envoltorio -->
                    <path d="M 95 250 Q 200 290 305 250 L 230 485 Q 200 495 170 485 Z" fill="url(#paper-front)" />
                    
                    <!-- Pliegues y Sombras 3D del Papel -->
                    <path d="M 160 310 Q 200 330 240 310 L 215 485 Q 200 490 185 485 Z" fill="#d9c3ab" opacity="0.5" />
                    <path d="M 95 250 Q 150 300 170 485" stroke="#b89f83" stroke-width="1.5" fill="none" opacity="0.6" />
                    <path d="M 305 250 Q 250 300 230 485" stroke="#b89f83" stroke-width="1.5" fill="none" opacity="0.6" />
                </g>

                <!-- LAZO Y MOÑO ELEGANTE EN LA BASE -->
                <g class="ribbon-bow" filter="url(#drop-shadow)">
                    <!-- Cintas colgantes -->
                    <path d="M 185 490 Q 160 540 135 580 Q 155 585 175 560 L 195 495 Z" fill="url(#ribbon-grad)" />
                    <path d="M 215 490 Q 240 540 265 580 Q 245 585 225 560 L 205 495 Z" fill="url(#ribbon-grad)" />

                    <!-- Orejas del Moño Izquierda -->
                    <path d="M 195 485 C 130 440 110 500 190 495 Z" fill="url(#ribbon-grad)" />
                    <path d="M 195 485 C 145 460 130 495 188 493 Z" fill="#dfb299" opacity="0.6" />

                    <!-- Orejas del Moño Derecha -->
                    <path d="M 205 485 C 270 440 290 500 210 495 Z" fill="url(#ribbon-grad)" />
                    <path d="M 205 485 C 255 460 270 495 212 493 Z" fill="#dfb299" opacity="0.6" />

                    <!-- Nudo Central -->
                    <rect x="188" y="478" width="24" height="20" rx="5" fill="#8c5b43" />
                    <rect x="190" y="480" width="20" height="16" rx="4" fill="url(#ribbon-grad)" />
                </g>

                <!-- DECORACIONES MAGICAS / DESTELLOS DE LUZ -->
                <g class="sparkle-star" style="animation-delay: 0.5s;">
                    <path d="M 270 180 L 273 187 L 280 190 L 273 193 L 270 200 L 267 193 L 260 190 L 267 187 Z" fill="#ffffff" filter="url(#glow-soft)" />
                    <circle cx="270" cy="190" r="2" fill="#fff" />
                </g>
                <g class="sparkle-star" style="animation-delay: 1.2s;">
                    <path d="M 100 160 L 102 165 L 107 167 L 102 169 L 100 174 L 98 169 L 93 167 L 98 165 Z" fill="#ffffff" filter="url(#glow-soft)" />
                </g>
                <g class="sparkle-star" style="animation-delay: 1.8s;">
                    <path d="M 295 310 L 297 314 L 301 315 L 297 316 L 295 320 L 293 316 L 289 315 L 293 314 Z" fill="#ffeeaa" filter="url(#glow-soft)" />
                </g>
            </svg>
        </div>

        <!-- Texto Romántico Final -->
        <div class="romantic-text-container">
            <h1 class="romantic-text">Para la doctora más hermosa ❤️</h1>
        </div>
    </div>

    <!-- JavaScript Interno para animación de partículas y estrellas -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;

            function resize() {
                width = canvas.width = canvas.parentElement.clientWidth;
                height = canvas.height = canvas.parentElement.clientHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            // Crear Partículas y Estrellas
            const numStars = 60;
            const numGoldParticles = 45;
            const elements = [];

            // Clases para elementos del fondo
            class Star {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.alpha = Math.random();
                    this.speed = Math.random() * 0.02 + 0.005;
                    this.growing = Math.random() > 0.5;
                }

                update() {
                    if (this.growing) {
                        this.alpha += this.speed;
                        if (this.alpha >= 1) this.growing = false;
                    } else {
                        this.alpha -= this.speed;
                        if (this.alpha <= 0.2) this.growing = true;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class GoldParticle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 20;
                    this.size = Math.random() * 2.5 + 1;
                    this.speedY = Math.random() * 0.8 + 0.3;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.alpha = Math.random() * 0.6 + 0.3;
                    this.decay = Math.random() * 0.002 + 0.001;
                }

                update() {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.y * 0.02) * 0.4 + this.speedX;
                    this.alpha -= this.decay;

                    if (this.y < -10 || this.alpha <= 0) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.fillStyle = "#ffd700";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#ffaa00";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Inicializar arreglos
            for (let i = 0; i < numStars; i++) {
                elements.push(new Star());
            }

            for (let i = 0; i < numGoldParticles; i++) {
                elements.push(new GoldParticle());
            }

            // Loop de animación
            function animate() {
                ctx.clearRect(0, 0, width, height);

                elements.forEach(el => {
                    el.update();
                    el.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>s
